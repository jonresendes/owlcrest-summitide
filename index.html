<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Only this site's own scripts may run (plus Google sign-in for the optional Drive export): injected markup cannot execute. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com https://accounts.google.com; frame-src 'self' blob: https://docs.google.com https://drive.google.com https://www.youtube-nocookie.com https://accounts.google.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1b2f5e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Summitide">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Summitide Learning · OwlCrest Academy</title>
  <meta name="description" content="A learning environment with study rooms, tests, games and a display case of achievements.">
  <!-- v59: Nunito, Lexend and Patrick Hand are served from this site (styles.css); nothing loads from Google Fonts. -->
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="math.css">   <!-- v61: calculator, practice room and Math Lab -->
</head>
<body>
  <header class="topbar">
    <button class="back-btn" id="backBtn" type="button" title="Back" aria-label="Back" hidden>← <span class="back-label">Back</span></button>
    <a href="#/" class="brand"><img src="logo.png" alt="Summitide Learning — OwlCrest Academy" class="brand-logo"></a>
    <nav class="topnav">
      <a href="#/" data-nav="home">My Desk</a>
      <a href="#/case" data-nav="case" hidden>Display Case</a>
    </nav>
    <div id="topTools" class="top-tools"></div>   <!-- v68: jump to a class, find a student, Live Class marker -->
    <div id="whoChip" class="who-chip"></div>
    <button class="btn sm accent install-btn" id="installBtn" hidden aria-label="Install app" title="Install app"><span class="install-label">Install app</span></button>
  </header>

  <main id="app" class="app"></main>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- ===== COURSES ===== -->
  <!-- v69: the app ships with no courses. Each course is loaded from a file by the Headmaster (Courses → Load a Course),
       kept in the school's cloud and on each device, and can be removed there. -->
  <script src="courseloader.js"></script>  <!-- every course: loaded from a file, kept in the cloud and on the device -->

  <!-- ===== CLOUD (Firebase) — accounts and live sync; set enabled:false in cloud-config.js for device-only mode ===== -->
  <!-- Firebase SDK 10.14.1, served from this site (copied from the official npm package) so no outside script is trusted. -->
  <script src="firebase-app-compat.js"></script>
  <script src="firebase-auth-compat.js"></script>
  <script src="firebase-firestore-compat.js"></script>
  <script src="cloud-config.js"></script>
  <script src="cloud.js"></script>

  <!-- ===== APP ===== -->
  <script src="storage.js"></script>
  <script src="util.js"></script>
  <script src="badges.js"></script>
  <script src="games.js"></script>
  <script src="print.js"></script>
  <script src="tables.js"></script>     <!-- v63: print every column of a table; CSV and Word files -->
  <script src="media.js"></script>
  <script src="drive.js"></script>
  <script src="overlay.js"></script>
  <script src="dashboard.js"></script>
  <script src="marking.js"></script>    <!-- v56: mark one item for the whole class -->
  <script src="marks.js"></script>      <!-- v68: mark categories, weights, No Mark and the final mark -->
  <script src="classes.js"></script>    <!-- v68: the class page and its areas, My Classes, Teachers, Staff -->
  <script src="curriculum.js"></script> <!-- v68: the Curriculum shelf -->
  <script src="live.js"></script>       <!-- v58: Live Class Board + Focus Mode -->
  <script src="privacy.js"></script>    <!-- v59: privacy notice, dictation disclosure, retention and deletion -->
  <script src="records.js"></script>     <!-- v66: sign-in codes and slips, a copy of everything held about a student, corrections, holds -->
  <script src="coins.js"></script>      <!-- v60: coins, teacher shops, redemption and the Locker -->
  <script src="app.js"></script>
  <script src="mathcore.js"></script>   <!-- v61: the math engine (safe expression reader, answer checking, practice generators) -->
  <script src="mathtools.js"></script>  <!-- v61: calculator, practice room and Math Lab for mathematics courses -->
  <script src="pwa.js"></script>
  <script src="report.js"></script>   <!-- "Found a problem?" button; loads html2canvas.min.js only when it is pressed -->
</body>
</html>
